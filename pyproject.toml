[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-platform"
version = "0.1.0"
description = "Real-time banking fraud detection with explainable ML and graph analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fraud-platform = "fraud_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraud_platform = ["dashboard/*.py"]
