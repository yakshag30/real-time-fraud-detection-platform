services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      FRAUD_DATABASE_URL: postgresql://fraud:fraud@db:5432/fraud
      FRAUD_BOOTSTRAP: "true"
      FRAUD_BOOTSTRAP_ROWS: "2000"
      FRAUD_REVIEW_THRESHOLD: "0.35"
      FRAUD_BLOCK_THRESHOLD: "0.75"
      FRAUD_ALERT_MIN_SCORE: "0.50"
      FRAUD_ANOMALY_WEIGHT: "0.25"
    volumes:
      - artifacts:/app/artifacts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    environment:
      API_URL: http://api:8000
    command:
      - streamlit
      - run
      - src/fraud_platform/dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
  artifacts:
